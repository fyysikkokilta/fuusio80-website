# Local development stack: Postgres + Next.js dev server.
# No `pnpm migrate` here: the dev server pushes the schema itself, and migrate would prompt
# interactively (and hang) once the DB has been dev-pushed.
# Usage: docker compose -f docker-compose.local.yml up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fuusio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fuusio']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: node:26-alpine
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URI: postgres://postgres:postgres@db:5432/fuusio
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - '3000:3000'
    command: >
      sh -c "apk add --no-cache ghostscript libc6-compat &&
             npm install -g corepack && corepack enable pnpm &&
             pnpm install --frozen-lockfile &&
             pnpm dev --hostname 0.0.0.0"

volumes:
  pgdata:
  node_modules:
  next_cache:
